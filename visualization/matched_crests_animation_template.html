<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matched Crest Propagation</title>
<style>
:root{--ink:#132238;--muted:#64748b;--line:#dbe4ee;--paper:#f4f8fb;--card:#fff;--sky:#168aad;--sky2:#62b6cb;--violet:#8b5cf6;--coral:#f97360;--mint:#16a085;--amber:#e9a23b;--shadow:0 18px 45px rgba(30,55,80,.12)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 80% 0,#dff4f7 0,transparent 34%),var(--paper);color:var(--ink);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
.shell{height:100%;display:grid;grid-template-rows:auto auto 1fr;gap:12px;padding:18px 20px 20px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{font:600 11px/1.2 Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}h1{font:600 clamp(25px,2.4vw,38px)/1.05 Georgia,"Times New Roman",serif;margin:5px 0 0}.subtitle{margin:6px 0 0;color:var(--muted);font-size:13px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stat{min-width:100px;padding:9px 12px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:12px}.stat b{display:block;font:600 18px/1 Georgia,serif;color:var(--sky)}.stat span{font:11px/1.2 Consolas,monospace;color:var(--muted)}
.controls{display:grid;grid-template-columns:auto minmax(180px,1fr) auto auto auto;align-items:center;gap:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(30,55,80,.07)}button,select,input{font:600 12px/1 "Segoe UI",sans-serif}.play{width:38px;height:34px;border:0;border-radius:10px;background:var(--sky);color:white;cursor:pointer}.play:hover{background:#0e7490}.range{width:100%;accent-color:var(--sky)}select,.search,.idx-input{height:34px;border:1px solid var(--line);border-radius:9px;background:#f8fbfd;color:var(--ink);padding:0 10px}.speed-select{color:var(--sky);border-color:#b7dbe6}.search{width:145px}.idx-input{width:92px}.readout{font:600 12px/1 Consolas,monospace;color:var(--sky);min-width:46px;text-align:right}.selector{grid-column:1/-1;display:flex;align-items:center;gap:7px;padding-top:8px;border-top:1px solid #e8eef3;flex-wrap:wrap}.selector-label{font:600 10px Consolas,monospace;letter-spacing:.09em;color:var(--muted);margin-right:2px}.nav-btn{height:32px;min-width:32px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#f8fbfd;color:var(--ink);cursor:pointer}.nav-btn:hover{border-color:var(--sky);color:var(--sky)}.clear-btn{color:var(--coral)}.isolate{display:flex;align-items:center;gap:5px;margin-left:auto;font-size:11px;color:var(--muted)}.isolate input{accent-color:var(--sky)}
.stage{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}.map-card,.side{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.map-card{position:relative;min-width:0}.map-card:before{content:"PROPAGATION PLANE";position:absolute;z-index:2;left:18px;top:15px;font:600 10px Consolas,monospace;letter-spacing:.13em;color:#527084;pointer-events:none}canvas{display:block;width:100%;height:100%;background:linear-gradient(180deg,#f8fcfe,#e8f3f7)}.legend{position:absolute;left:16px;bottom:14px;display:flex;gap:12px;background:rgba(255,255,255,.88);border:1px solid var(--line);padding:7px 10px;border-radius:10px;font-size:11px;backdrop-filter:blur(8px)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.m1{background:var(--sky)}.m2{background:var(--violet)}.moor{background:var(--coral)}
.side{display:flex;flex-direction:column;padding:17px;overflow:auto}.side h2{font:600 19px Georgia,serif;margin:6px 0 10px}.accent{width:38px;height:3px;border-radius:2px;background:var(--coral);margin-bottom:3px}.section-label{margin:13px 0 7px;font:600 10px Consolas,monospace;letter-spacing:.11em;color:var(--sky);text-transform:uppercase}.detail{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:11px}.detail dt{color:var(--muted)}.detail dd{margin:0;font:600 11px Consolas,monospace;text-align:right}.note{margin-top:14px;padding:12px;border-radius:11px;background:#f0f8fa;border-left:3px solid var(--sky);color:#496477;font-size:11px;line-height:1.55}.warning{color:var(--coral)!important}.foot{margin-top:12px;color:var(--muted);font:10px/1.45 Consolas,monospace;word-break:break-all}
@media(max-width:850px){body{overflow:auto}.shell{min-height:100%;height:auto}.topbar{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}.controls{grid-template-columns:auto 1fr auto}.controls select{grid-row:2}.selector{grid-row:3}.isolate{margin-left:0}.stage{grid-template-columns:1fr;grid-template-rows:65vh auto}.side{min-height:300px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div><div class="eyebrow">South China Sea · matched crest atlas</div><h1>波峰线匹配速度传播</h1><p class="subtitle">所有波峰线按各自沿传播方向的隐含匹配速度，同步推进至对应系泊匹配位置</p></div>
    <div class="stats"><div class="stat"><b id="nCrests">—</b><span>CRESTS</span></div><div class="stat"><b id="medSpeed">—</b><span>MEDIAN m/s</span></div><div class="stat"><b id="medDt">—</b><span>MEDIAN |Δt| h</span></div></div>
  </header>
  <section class="controls" aria-label="animation controls">
    <button class="play" id="play" title="播放/暂停">▶</button>
    <input class="range" id="progress" type="range" min="0" max="1000" value="0">
    <span class="readout" id="readout">0.0%</span>
    <select class="speed-select" id="playbackSpeed" title="播放倍速"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select>
    <select id="filter" title="Mode 筛选"><option value="all">全部 Mode</option><option value="1">Mode 1</option><option value="2">Mode 2</option></select>
    <div class="selector">
      <span class="selector-label">MATCH IDX 1–850</span><button class="nav-btn" id="prev" title="上一条">←</button><input class="idx-input" id="rowIndex" type="number" min="1" max="850" placeholder="row idx"><button class="nav-btn" id="next" title="下一条">→</button>
      <span class="selector-label">GLOBAL CREST</span><input class="search" id="crestSearch" placeholder="crest_idx ↵" inputmode="numeric"><button class="nav-btn clear-btn" id="clear">查看全部</button>
      <label class="isolate"><input id="isolate" type="checkbox" checked> 只显示选中波峰线</label>
    </div>
  </section>
  <section class="stage">
    <div class="map-card"><canvas id="map"></canvas><div class="legend"><span><i class="dot m1"></i>Mode 1</span><span><i class="dot m2"></i>Mode 2</span><span><i class="dot moor"></i>Mooring / 100 km</span></div></div>
    <aside class="side"><div class="eyebrow">Matched pair inspector</div><h2 id="selectedTitle">全体总览</h2><div class="accent"></div><div id="detail"></div><div class="note">进度 0% 是遥感观测位置；100% 是按匹配关系平移到系泊时刻的位置。绿色菱形是传播后最接近系泊点的位置，灰色虚线表示剩余横向距离。</div><div class="foot" id="source"></div></aside>
  </section>
</main>
<script>
const DATA=__CREST_DATA_JSON__;
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const el={play:document.getElementById('play'),progress:document.getElementById('progress'),readout:document.getElementById('readout'),speed:document.getElementById('playbackSpeed'),filter:document.getElementById('filter'),row:document.getElementById('rowIndex'),crestSearch:document.getElementById('crestSearch'),prev:document.getElementById('prev'),next:document.getElementById('next'),clear:document.getElementById('clear'),isolate:document.getElementById('isolate'),detail:document.getElementById('detail'),title:document.getElementById('selectedTitle')};
let progress=0,playing=false,last=0,selected=null,filter='all',isolate=true,playbackRate=1;
const colors={1:'#168aad',2:'#8b5cf6',other:'#78909c'},bounds=DATA.map.bounds;
document.getElementById('nCrests').textContent=DATA.stats.count.toLocaleString();
document.getElementById('medSpeed').textContent=DATA.stats.medianSpeed.toFixed(2);
document.getElementById('medDt').textContent=DATA.stats.medianAbsDtHours.toFixed(1);
document.getElementById('source').textContent=`SOURCE · ${DATA.meta.source}\nGenerated ${DATA.meta.generated}`;
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}
function frameBox(){const w=canvas.clientWidth,h=canvas.clientHeight,p={l:54,r:22,t:46,b:42};return{w,h,p,pw:w-p.l-p.r,ph:h-p.t-p.b}}
function xy(lon,lat){const f=frameBox();return[f.p.l+(lon-bounds[0])/(bounds[1]-bounds[0])*f.pw,f.p.t+(bounds[3]-lat)/(bounds[3]-bounds[2])*f.ph]}
function drawGrid(){const f=frameBox();ctx.clearRect(0,0,f.w,f.h);ctx.save();ctx.strokeStyle='#cbdde6';ctx.fillStyle='#78909c';ctx.lineWidth=1;ctx.font='10px Consolas';for(let lon=110;lon<=122;lon+=2){const [x,y]=xy(lon,18);ctx.beginPath();ctx.moveTo(x,f.p.t);ctx.lineTo(x,f.h-f.p.b);ctx.stroke();ctx.fillText(`${lon}°E`,x-14,y+20)}for(let lat=18;lat<=23;lat++){const [x,y]=xy(110,lat);ctx.beginPath();ctx.moveTo(f.p.l,y);ctx.lineTo(f.w-f.p.r,y);ctx.stroke();ctx.fillText(`${lat}°N`,x-40,y+3)}ctx.strokeStyle='#9eb9c7';ctx.strokeRect(f.p.l,f.p.t,f.pw,f.ph);ctx.restore()}
function drawMooring(){const m=DATA.map.mooring,[x,y]=xy(m.lon,m.lat),f=frameBox();const rx=(m.radiusKm/(111.32*Math.cos(m.lat*Math.PI/180)))/(bounds[1]-bounds[0])*f.pw,ry=(m.radiusKm/110.54)/(bounds[3]-bounds[2])*f.ph;ctx.save();ctx.setLineDash([7,5]);ctx.strokeStyle='rgba(249,115,96,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f97360';ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?4:9;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.font='600 11px Consolas';ctx.fillText('MOORING',x+13,y-9);ctx.restore()}
function visible(c){return filter==='all'||String(c.mode)===filter}
function drawCrest(c,p,strong=false){if((!strong&&!visible(c))||!c.lon.length)return;ctx.beginPath();for(let j=0;j<c.lon.length;j++){const [x,y]=xy(c.lon[j]+c.dLon*p,c.lat[j]+c.dLat*p);j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=strong?'#f05d44':(colors[c.mode]||colors.other);ctx.globalAlpha=strong?1:.26;ctx.lineWidth=strong?3:1.05;ctx.stroke();ctx.globalAlpha=1}
function drawSelectedMarkers(c){const m=DATA.map.mooring;if(Number.isFinite(c.hitLon)&&Number.isFinite(c.hitLat)){const [hx,hy]=xy(c.hitLon,c.hitLat),[mx,my]=xy(m.lon,m.lat);ctx.save();ctx.setLineDash([5,4]);ctx.strokeStyle='#78909c';ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(mx,my);ctx.stroke();ctx.setLineDash([]);ctx.translate(hx,hy);ctx.rotate(Math.PI/4);ctx.fillStyle='#16a085';ctx.fillRect(-5,-5,10,10);ctx.restore()}if(Number.isFinite(c.peakLon)&&Number.isFinite(c.peakLat)){const [px,py]=xy(c.peakLon+c.dLon*progress,c.peakLat+c.dLat*progress);ctx.fillStyle='#e9a23b';ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fill()}}
function draw(){drawGrid();if(!(selected&&isolate)){for(const c of DATA.crests)if(c!==selected)drawCrest(c,progress)}if(selected){drawCrest(selected,progress,true);drawSelectedMarkers(selected)}drawMooring();el.readout.textContent=`${(progress*100).toFixed(1)}%`;el.progress.value=Math.round(progress*1000);updateDetail()}
function fmt(v,d=2){return Number.isFinite(v)?v.toFixed(d):'N/A'}
function updateDetail(){const m=DATA.map.mooring;if(!selected){el.title.textContent='全体总览';el.detail.innerHTML=`<div class="section-label">Dataset</div><dl class="detail"><dt>Mode 1 / Mode 2</dt><dd>${DATA.stats.mode1} / ${DATA.stats.mode2}</dd><dt>保留折点</dt><dd>${DATA.stats.points.toLocaleString()}</dd><dt>速度 P90</dt><dd>${fmt(DATA.stats.p90Speed)} m/s</dd><dt>时空符号异常</dt><dd class="${DATA.stats.signMismatch?'warning':''}">${DATA.stats.signMismatch}</dd></dl><div class="section-label">Mooring station</div><dl class="detail"><dt>经度 / 纬度</dt><dd>${m.lon.toFixed(4)}°E / ${m.lat.toFixed(4)}°N</dd><dt>匹配半径</dt><dd>${m.radiusKm} km</dd></dl>`;return}const c=selected;el.title.textContent=`Match idx ${c.row} · Crest #${c.id}`;el.detail.innerHTML=`<div class="section-label">Crest line</div><dl class="detail"><dt>全局 crest_idx</dt><dd>${c.id}</dd><dt>Mode</dt><dd>${c.mode}</dd><dt>遥感时刻</dt><dd>${c.crestTime}</dd><dt>传播方向</dt><dd>${fmt(c.dir,1)}°</dd><dt>曲率峰点</dt><dd>${fmt(c.peakLon,4)}°E / ${fmt(c.peakLat,4)}°N</dd><dt>K mooring</dt><dd>${fmt(c.k,3)}</dd></dl><div class="section-label">Matched mooring observation</div><dl class="detail"><dt>系泊坐标</dt><dd>${m.lon.toFixed(4)}°E / ${m.lat.toFixed(4)}°N</dd><dt>匹配时刻</dt><dd>${c.mooringTime}</dd><dt>匹配半径</dt><dd>${m.radiusKm} km</dd><dt>隐含速度</dt><dd>${fmt(c.speed,3)} m/s</dd><dt>当前位移历时</dt><dd>${fmt(c.dtHours*progress,1)} h</dd><dt>总时间差</dt><dd>${fmt(c.dtHours,1)} h</dd><dt>沿向 / 横向距离</dt><dd>${fmt(c.alongKm,1)} / ${fmt(c.crossKm,1)} km</dd><dt>速度差 / 方向差</dt><dd>${fmt(c.speedDiff,3)} / ${fmt(c.dirDiff,1)}°</dd><dt>传播后最近点</dt><dd>${fmt(c.hitLon,4)}°E / ${fmt(c.hitLat,4)}°N</dd><dt>时空方向一致</dt><dd class="${c.signOK?'':'warning'}">${c.signOK?'是':'否'}</dd></dl>`}
function selectCrest(c){selected=c||null;if(selected){el.row.value=selected.row;el.crestSearch.value=selected.id;isolate=el.isolate.checked;progress=0;playing=false;el.play.textContent='▶'}draw()}
function tick(t){if(!playing)return;if(!last)last=t;progress+=(t-last)/24000*playbackRate;last=t;if(progress>=1){progress=1;playing=false;el.play.textContent='↺'}draw();if(playing)requestAnimationFrame(tick)}
el.play.addEventListener('click',()=>{if(progress>=1)progress=0;playing=!playing;el.play.textContent=playing?'❚❚':'▶';last=0;if(playing)requestAnimationFrame(tick)});
el.progress.addEventListener('input',e=>{progress=+e.target.value/1000;playing=false;el.play.textContent='▶';draw()});
el.speed.addEventListener('change',e=>{playbackRate=Number(e.target.value)||1;last=0});
el.filter.addEventListener('change',e=>{filter=e.target.value;draw()});
el.row.addEventListener('change',e=>{const row=Math.max(1,Math.min(DATA.crests.length,Number(e.target.value)));selectCrest(DATA.crests[row-1])});
el.row.addEventListener('keydown',e=>{if(e.key==='Enter')e.target.dispatchEvent(new Event('change'))});
el.crestSearch.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=Number(e.target.value.trim());selectCrest(DATA.crests.find(c=>c.id===id))});
el.prev.addEventListener('click',()=>selectCrest(DATA.crests[Math.max(0,(selected?selected.row-1:1)-1)]));
el.next.addEventListener('click',()=>selectCrest(DATA.crests[Math.min(DATA.crests.length-1,(selected?selected.row+1:1)-1)]));
el.clear.addEventListener('click',()=>{selected=null;el.row.value='';el.crestSearch.value='';draw()});
el.isolate.addEventListener('change',e=>{isolate=e.target.checked;draw()});
new ResizeObserver(resize).observe(canvas);resize();
</script>
</body>
</html>
