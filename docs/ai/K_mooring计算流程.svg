<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" role="img" aria-labelledby="title desc">
  <title id="title">K_mooring计算流程</title>
  <desc id="desc">匹配前缓存凸起点，匹配后独立寻找过站点，以凸起点为零点归一化并保存。按2026年11月9日工作区代码绘制。</desc>
  <style>
    text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17212b;text-anchor:middle}
    .heading{font-size:26px;font-weight:600}.label{font-size:19px;font-weight:600}
    .detail{font-size:16px;fill:#43515f}.code{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#516273}
    .node{fill:#f7f8fa;stroke:#c8d0d8;stroke-width:1.5;rx:10}
    .focus{stroke:#238357;stroke-width:2}
    .arrow{fill:none;stroke:#647381;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L7 4 L1 7 Z" fill="#647381"/></marker></defs>
  <rect width="1000" height="1240" fill="white"/>
  <text class="heading" x="500" y="44">K_mooring 计算流程</text>
  <text class="detail" x="500" y="74">代码定位：在 TRAE 按 ⌘P，输入“文件路径:行号”</text>

  <rect class="node" x="150" y="105" width="700" height="140"/>
  <text class="label" x="500" y="135">匹配前：提取 peak，缓存波锋几何</text>
  <text class="detail" x="500" y="162">buildCrestData → analyze_crest_shape_orig</text>
  <text class="detail" x="500" y="189">低纬端作为起点；重采样、平滑、加权曲率寻峰</text>
  <text class="detail" x="500" y="213">得到重采样坐标、凸起点弧长 s_peak、总长 L_total</text>
  <text class="code" x="500" y="235">utils/geometry/analyze_crest_shape_orig.m:61</text>
  <path class="arrow" d="M500 245 V305"/>

  <rect class="node" x="150" y="305" width="700" height="125"/>
  <text class="label" x="500" y="335">全局匹配后：独立寻找过站点</text>
  <text class="detail" x="500" y="362">reachMooringByTranslation：重算方向 → 投影 → 平移波锋</text>
  <text class="detail" x="500" y="389">当前调用不传 s_peak_input，也不传匹配事件时间窗</text>
  <text class="code" x="500" y="417">src/simu_all_crests_trans_dir_pro.m:257</text>
  <path class="arrow" d="M350 430 V454 Q350 470 270 470 V495"/>
  <path class="arrow" d="M650 430 V454 Q650 470 730 470 V495"/>

  <rect class="node" x="75" y="495" width="390" height="125"/>
  <text class="label" x="270" y="525">投影横向距离 ≤1 mm</text>
  <text class="detail" x="270" y="552">按直接命中处理</text>
  <text class="detail" x="270" y="577">取投影交点的连续弧长 s_direct</text>
  <text class="code" x="270" y="604">utils/trans/reachMooringByTranslation.m:123</text>
  <rect class="node" x="535" y="495" width="390" height="125"/>
  <text class="label" x="730" y="525">未直接命中</text>
  <text class="detail" x="730" y="552">平移后，在100 km圈内寻找节点</text>
  <text class="detail" x="730" y="577">当前取距站最近的节点；无节点则失败</text>
  <text class="code" x="730" y="604">utils/trans/reachMooringByTranslation.m:133</text>
  <path class="arrow" d="M270 620 V648 Q270 664 400 664 V695"/>
  <path class="arrow" d="M730 620 V648 Q730 664 600 664 V695"/>

  <rect class="node focus" x="150" y="695" width="700" height="185"/>
  <text class="label" x="500" y="725">主脚本计算 K_mooring：以 peak 为零点</text>
  <text class="detail" x="500" y="751">过站点成功：先将 s_hit 限制在 [0,L_total]</text>
  <text class="detail" x="500" y="778">s_hit ≤ s_peak：K = (s_hit − s_peak) / s_peak</text>
  <text class="detail" x="500" y="805">s_hit &gt; s_peak：K = (s_hit − s_peak) / (L_total − s_peak)</text>
  <text class="detail" x="500" y="831">分母使用退化保护；过站点计算失败则 K = NaN</text>
  <text class="code" x="500" y="864">src/simu_all_crests_trans_dir_pro.m:261</text>
  <path class="arrow" d="M500 880 V940"/>

  <rect class="node" x="150" y="940" width="700" height="105"/>
  <text class="label" x="500" y="970">按系泊事件时间排序，保存 MAT</text>
  <text class="detail" x="500" y="997">保存 K_mooring、peak坐标、波锋坐标、KdV波速及匹配信息</text>
  <text class="code" x="500" y="1026">src/simu_all_crests_trans_dir_pro.m:280</text>
  <text class="detail" x="500" y="1090">peak 是参考点；K 表示过站点相对 peak 的归一化弧长位置。</text>
  <text class="detail" x="500" y="1118">负/正表示弧长顺序中 peak 之前/之后，不表示传播时间前后。</text>
  <text class="detail" x="500" y="1146">匹配评分的传播最近点与此处过站点独立计算，可能不同。</text>
  <text class="code" x="500" y="1182">代码快照：2026-11-09；行号随后续修改可能变化。</text>
</svg>
